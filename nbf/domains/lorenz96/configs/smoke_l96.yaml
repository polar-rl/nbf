model:
  input_dim: 8
  output_dim: 8
  embedding:
    block_type: set_transformer
    embedding_dim: 32
    hidden_size: 64
    num_rounds: 2
    num_heads: 4
    num_inducing: 8
    pool_type: attention
  generator:
    flow_type: fm
    conditioning: concat
    fm_hidden_size: 64
    fm_num_layers: 2
    fm_time_embed_dim: 8
    fm_num_steps: 20
    fm_sigma_min: 1e-4

training:
  num_iterations: 12
  learning_rate: 1.0e-3
  end_learning_rate: 1.0e-4
  warmup_steps: 2
  batch_size: 16
  log_interval: 4
  checkpoint_interval: 8
  clip_grad_norm: 1.0
  seed: 0
  rollout_proposals: [bootstrap, optimal]
  rollout_num_particles: 64
  episodes_per_rollout: 4
  grad_steps_per_rollout: 4
  rollout_fm_steps: 4
  rollout_bf16: false
  norm_episodes: 8
  val_episodes: 4
  val_interval: 8

data:
  K: 8
  episode_length: 5
  dt: 0.01
  window_substeps: 5
  sigma_dyn: 0.25
  sigma_obs_min: 0.5
  sigma_obs_max: 1.5
  f_bands: [[5.0, 7.0], [9.0, 11.0]]
  spinup_time: 10.0
  sigma_init: 2.0

save_path: results/lorenz96/smoke/
