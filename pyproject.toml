[project]
name = 'nbf'
version = '0.0.1'
description = 'Amortized Bayesian filtering algorithm built on learned distribution embeddings.'
readme = 'README.md'
requires-python = '>=3.13,<3.14'
dependencies = [
    'embedex>=0.0.1',
    'equinox>=0.13.5',
    'jax>=0.9.1',
    'jumanji>=1.1.0',
    'matplotlib>=3.10.8',
    'numpy>=2.4.2',
    'optax>=0.2.7',
    'pyyaml>=6.0.3',
    'scipy>=1.17.1',
    'tqdm>=4.67.3',
]

[project.optional-dependencies]
gpu = [
    "jax[cuda12]>=0.9.1; sys_platform == 'linux'",
]
dev = [
    'pre-commit>=4.5.1',
    'pytest>=9.0.2',
    'ruff>=0.15.5',
]

[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['nbf*']

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
embedex = { path = '../embedex', editable = true }

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = ['--import-mode=importlib']
markers = ["slow: end-to-end training runs and long reference checks (deselect with -m 'not slow')"]
filterwarnings = [
    # `tensorflow_probability` still touches deprecated JAX internals.
    'ignore:jax.core.pytype_aval_mappings is deprecated:DeprecationWarning',
]

[tool.ruff]
indent-width = 4
line-length = 100
target-version = 'py313'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = [
    'E',  # pycodestyle
    'F',  # pyflakes
    'UP',  # pyupgrade
    'B',  # flake8-bugbear
    'SIM',  # flake8-simplify
    'I',  # isort
]
ignore = [
    'E501',  # line too long
    'E731',  # do not assign a lambda expression
]
