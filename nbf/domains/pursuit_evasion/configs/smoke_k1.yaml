model:
  input_dim: 2
  output_dim: 2
  embedding:
    block_type: set_transformer
    embedding_dim: 32
    hidden_size: 64
    num_rounds: 2
    num_heads: 4
    num_inducing: 8
  generator:
    flow_type: fm
    conditioning: concat
    fm_hidden_size: 64
    fm_num_layers: 2
    fm_time_embed_dim: 8
    fm_num_steps: 20
    fm_sigma_min: 1e-4

training:
  num_iterations: 12
  learning_rate: 1.0e-3
  end_learning_rate: 1.0e-4
  warmup_steps: 2
  batch_size: 16
  log_interval: 4
  checkpoint_interval: 8
  clip_grad_norm: 1.0
  seed: 0
  rollout_proposals: [bootstrap]
  rollout_num_particles: 32
  episodes_per_rollout: 3
  grad_steps_per_rollout: 4
  rollout_fm_steps: 5
  rollout_bf16: false
  val_episodes: 2
  val_interval: 8

data:
  num_evaders: 1
  episode_length: 5

save_path: results/pursuit_evasion/smoke/
