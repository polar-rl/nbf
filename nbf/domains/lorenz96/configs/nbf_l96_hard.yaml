model:
  input_dim: 20
  output_dim: 20
  embedding:
    block_type: set_transformer
    embedding_dim: 192
    hidden_size: 512
    num_rounds: 3
    num_heads: 8
    num_inducing: 64
    pool_type: attention
  generator:
    flow_type: fm
    conditioning: concat
    fm_hidden_size: 512
    fm_num_layers: 8
    fm_time_embed_dim: 16
    fm_num_steps: 100
    fm_sigma_min: 1e-4

training:
  num_iterations: 100000
  learning_rate: 1.0e-4
  end_learning_rate: 1.0e-6
  warmup_steps: 5000
  batch_size: 256
  num_samples: 4096
  log_interval: 100
  checkpoint_interval: 10000
  clip_grad_norm: 1.0
  seed: 0

data:
  K: 20
  num_scenarios: 5000
  block_size: 4
  episode_length: 20
  num_pf_particles: 2000000
  dt: 0.01
  window_substeps: 40
  sigma_dyn: 0.25
  sigma_obs_min: 0.5
  sigma_obs_max: 1.1
  f_bands: [[5.0, 7.0], [9.0, 11.0]]
  spinup_time: 10.0
  sigma_init: 2.0
  num_val_scenarios: 250

data_path: data/lorenz96_hard/
save_path: results/k20/nbf_hard/
