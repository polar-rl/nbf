model:
  input_dim: 4
  output_dim: 4
  embedding:
    block_type: set_transformer
    embedding_dim: 128
    hidden_size: 256
    num_rounds: 3
    num_heads: 8
    num_inducing: 64
  generator:
    flow_type: fm
    conditioning: concat
    fm_hidden_size: 256
    fm_num_layers: 6
    fm_time_embed_dim: 16
    fm_num_steps: 100
    fm_sigma_min: 1e-4

training:
  num_iterations: 250000
  learning_rate: 1.0e-4
  end_learning_rate: 1.0e-6
  warmup_steps: 5000
  batch_size: 256
  num_samples: 2048
  log_interval: 100
  checkpoint_interval: 10000
  clip_grad_norm: 1.0
  seed: 0

data:
  num_evaders: 2
  num_episodes_per_policy: 50
  episode_length: 20
  num_policies: 1000
  num_pf_particles: 100000
  shuffle_observations: true
  interaction_radius: 1.5
  interaction_strength: 1.0

data_path: data/pursuit_evasion/
save_path: results/pursuit_evasion/k2/nbf/
