model:
  input_dim: 8
  output_dim: 8
  embedding:
    block_type: set_transformer
    embedding_dim: 32
    hidden_size: 64
    num_rounds: 2
    num_heads: 4
    num_inducing: 8
    pool_type: attention
  generator:
    flow_type: fm
    conditioning: concat
    fm_hidden_size: 64
    fm_num_layers: 2
    fm_time_embed_dim: 8
    fm_num_steps: 20
    fm_sigma_min: 1e-4

training:
  num_iterations: 200
  learning_rate: 1.0e-3
  end_learning_rate: 1.0e-4
  warmup_steps: 10
  batch_size: 16
  num_samples: 64
  log_interval: 50
  checkpoint_interval: 0
  clip_grad_norm: 1.0
  seed: 0

data:
  K: 8
  num_scenarios: 20
  block_size: 10
  episode_length: 20
  num_pf_particles: 2000
  dt: 0.01
  window_substeps: 5
  sigma_dyn: 0.25
  sigma_obs_min: 0.5
  sigma_obs_max: 1.5
  f_bands: [[5.0, 7.0], [9.0, 11.0]]
  spinup_time: 10.0
  sigma_init: 2.0
  num_val_scenarios: 4

data_path: data/lorenz96/smoke/
save_path: results/lorenz96/smoke/nbf/
