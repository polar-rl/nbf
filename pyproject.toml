[project]
name = 'nbf'
version = '0.0.1'
description = 'Neural Bayesian Filtering library and the pursuit-evasion domain it was developed for.'
readme = 'README.md'
requires-python = '>=3.13,<3.14'
dependencies = [
    'distrax>=0.1.7',
    'embedex',
    'equinox>=0.13.5',
    'jax>=0.9.1',
    'jumanji>=1.1.0',
    'matplotlib>=3.10.8',
    'minfx>=0.7.1',
    'numpy>=2.4.2',
    'optax>=0.2.7',
    'pyarrow>=23.0.1',
    'pyyaml>=6.0.3',
    'scipy>=1.17.1',
    'scikit-learn>=1.3',
    'seaborn>=0.13.2',
    'tqdm>=4.67.3',
]

[project.optional-dependencies]
gpu = [
    'jax[cuda12]>=0.9.1',
]
dev = [
    'pre-commit>=4.5.1',
    'pytest>=9.0.2',
    'ruff>=0.15.5',
]

[tool.uv.sources]
embedex = { git = 'ssh://git@github.com/polar-rl/embedex.git', branch = 'main' }

[build-system]
requires = ['setuptools', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ['nbf*']

[tool.ruff]
indent-width = 4
line-length = 100
target-version = 'py313'

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'

[tool.ruff.lint]
select = [
    'E',  # pycodestyle
    'F',  # pyflakes
    'UP',  # pyupgrade
    'B',  # flake8-bugbear
    'SIM',  # flake8-simplify
    'I',  # isort
]
ignore = [
    'E501',  # line too long
    'E731',  # do not assign a lambda expression
]
