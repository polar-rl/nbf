# Easy regime (window 0.05), K = 40, on-policy gold-state training (2026-09-15).
# Copy of nbf_l96_hard_k20.yaml with K doubled; embedding_dim 192 -> 256 for the
# doubled input, everything else unchanged.
model:
  input_dim: 40
  output_dim: 40
  embedding:
    block_type: set_transformer
    embedding_dim: 256
    hidden_size: 512
    num_rounds: 3
    num_heads: 8
    num_inducing: 64
    pool_type: attention
  generator:
    flow_type: fm
    conditioning: concat
    fm_hidden_size: 512
    fm_num_layers: 8
    fm_time_embed_dim: 16
    fm_num_steps: 100
    fm_sigma_min: 1e-4

training:
  num_iterations: 100000
  learning_rate: 1.0e-4
  end_learning_rate: 1.0e-6
  warmup_steps: 5000
  batch_size: 256
  log_interval: 100
  checkpoint_interval: 5000
  clip_grad_norm: 1.0
  seed: 0
  # On-policy rollouts: the NBF filter itself, current parameters, alternating the
  # listed proposals per rollout so one checkpoint serves every eval row.
  rollout_proposals: [bootstrap, optimal]
  rollout_num_particles: 2048    # the deployment n
  episodes_per_rollout: 64       # 64 x 21 = 1344 rows per rollout
  grad_steps_per_rollout: 40     # 40 x 256 = 10240 draws per rollout (~7.6 passes over the rows)
  rollout_fm_steps: 10           # ODE steps during on-policy rollouts; eval keeps 100
  rollout_bf16: true             # bf16 velocity net during rollouts (the eval --bf16_sampling path)
  norm_episodes: 512
  val_episodes: 64
  val_interval: 5000

data:
  K: 40
  episode_length: 20
  dt: 0.01
  window_substeps: 5
  sigma_dyn: 0.25
  sigma_obs_min: 0.5
  sigma_obs_max: 1.1
  f_bands: [[5.0, 7.0], [9.0, 11.0]]
  spinup_time: 10.0
  sigma_init: 2.0

save_path: results/k40/nbf_easy/
