repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: double-quote-string-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer

  - repo: local
    hooks:
      # Developers may point a uv source at a local clone (see pyproject.toml), but such
      # a source should not reach the repository as it would not exist for anyone else.
      - id: no-local-sources
        name: no local package sources
        language: pygrep
        entry: '^[^#\n]*\b(path|editable|directory)\s*=\s*["''](?!\.["''])'
        files: ^(pyproject\.toml|uv\.lock)$
